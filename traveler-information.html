<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveler Information — TRAVELKONNECT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--navy:#071a32;--orange:#ff724c;--cream:#fff8ee;--ink:#12233b;--muted:#708097;--line:#dfe6ef}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans",sans-serif;background:var(--cream);color:var(--ink)}.header{padding:23px 0 70px;color:#fff;background:linear-gradient(120deg,#071a32,#174b82)}.wrap{width:min(1000px,92%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:1.4rem;font-weight:700;letter-spacing:-.7px}.logo span{color:var(--orange)}.back{color:#fff;text-decoration:none;font-size:.9rem}.header h1{margin-top:55px;font:clamp(2.4rem,5vw,4rem)/1 "Playfair Display",serif}.header p{margin-top:12px;color:#d9e4f5}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;transform:translateY(-30px)}.panel{padding:29px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(18,35,59,.08)}h2{font:1.8rem "Playfair Display",serif}.panel>p{margin-top:8px;color:var(--muted)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.field.wide{grid-column:span 2}.field label{display:block;margin-bottom:7px;font-size:.85rem;font-weight:700}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit}.button{width:100%;margin-top:22px;border:0;border-radius:30px;padding:14px 20px;background:var(--orange);color:#fff;font:700 .9rem "DM Sans",sans-serif;cursor:pointer}.trip-row{padding:15px 0;border-bottom:1px solid var(--line)}.trip-row:last-child{border-bottom:0}.trip-row small{display:block;margin-top:4px;color:var(--muted)}.confirmation{display:none;text-align:center;padding:25px}.confirmation.show{display:block}.check{display:grid;place-items:center;width:65px;height:65px;margin:0 auto 18px;border-radius:50%;color:#147542;background:#dff6e9;font-size:2rem}@media(max-width:720px){.layout{grid-template-columns:1fr}.header{padding-bottom:55px}}@media(max-width:450px){.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}}
  </style>
</head>
<body>
  <header class="header"><div class="wrap"><div class="top"><div class="logo">TRAVEL<span>KONNECT</span></div><a class="back" href="choose-seat.html">← Back to seats</a></div><h1>Traveller information</h1><p>Enter the passenger details to complete your reservation.</p></div></header>
  <main class="wrap layout"><section class="panel" id="formPanel"><h2>Passenger details</h2><p>These details will be used for your ticket and travel updates.</p><form id="travelerForm"><div class="fields"><div class="field"><label for="firstName">First name</label><input id="firstName" required autocomplete="given-name" /></div><div class="field"><label for="lastName">Last name</label><input id="lastName" required autocomplete="family-name" /></div><div class="field wide"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" /></div><div class="field"><label for="phone">Nigerian phone number</label><input id="phone" type="tel" required placeholder="e.g. 0801 234 5678" autocomplete="tel" /></div><div class="field"><label for="gender">Gender</label><select id="gender" required><option value="" selected disabled>Select</option><option>Female</option><option>Male</option><option>Prefer not to say</option></select></div><div class="field wide"><label for="emergency">Emergency contact (optional)</label><input id="emergency" type="tel" placeholder="Phone number" /></div></div><button class="button" type="submit">Confirm traveller information</button></form></section><aside class="panel" id="tripPanel"><h2>Booking summary</h2><div id="summary"></div></aside></main>
  <script>
    const params=new URLSearchParams(location.search);const trip=Object.fromEntries(params.entries());const parsedDate=trip.date?new Date(trip.date+'T12:00:00'):null;const prettyDate=parsedDate&&!Number.isNaN(parsedDate.getTime())?parsedDate.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'Date to be confirmed';document.getElementById('summary').innerHTML=`<div class="trip-row"><strong>${trip.from||'Origin'} → ${trip.to||'Destination'}</strong><small>${prettyDate} · ${trip.travelers||'1 Passenger'}</small></div><div class="trip-row"><strong>${trip.company||'Selected operator'}</strong><small>${trip.price||'Fare to be confirmed'} · Seat ${trip.seat||'Not selected'}</small></div>`;
    document.getElementById('travelerForm').addEventListener('submit',event=>{event.preventDefault();const traveler={firstName:document.getElementById('firstName').value.trim(),lastName:document.getElementById('lastName').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),gender:document.getElementById('gender').value,emergency:document.getElementById('emergency').value.trim()};const booking={...trip,traveler};localStorage.setItem('travelkonnectBooking',JSON.stringify(booking));location.href=`payment.html?${new URLSearchParams(trip)}`});
  </script>
</body>
</html>
