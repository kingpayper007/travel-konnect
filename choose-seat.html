<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Seat — TRAVELKONNECT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--navy:#071a32;--orange:#ff724c;--cream:#fff8ee;--ink:#12233b;--muted:#708097;--line:#dfe6ef}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans",sans-serif;background:var(--cream);color:var(--ink)}.header{padding:23px 0 70px;color:#fff;background:linear-gradient(120deg,#071a32,#174b82)}.wrap{width:min(1000px,92%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:1.4rem;font-weight:700;letter-spacing:-.7px}.logo span{color:var(--orange)}.back{color:#fff;text-decoration:none;font-size:.9rem}.header h1{margin-top:55px;font:clamp(2.4rem,5vw,4rem)/1 "Playfair Display",serif}.header p{margin-top:12px;color:#d9e4f5}.booking{display:grid;grid-template-columns:1fr .8fr;gap:22px;transform:translateY(-30px)}.panel{padding:28px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(18,35,59,.08)}.panel h2{font:1.8rem "Playfair Display",serif}.panel p{margin-top:8px;color:var(--muted)}.legend{display:flex;flex-wrap:wrap;gap:13px;margin:22px 0;font-size:.84rem;color:var(--muted)}.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:5px;vertical-align:-2px;background:#e4eaf2}.legend i.selected{background:var(--orange)}.legend i.occupied{background:#9aa9bb}.bus{max-width:380px;margin:12px auto;padding:20px;border:1px solid var(--line);border-radius:20px;background:#f9fbfd}.driver{width:68px;margin:0 0 20px auto;padding:8px;text-align:center;border-radius:8px;background:#dce6f2;color:#56708e;font-size:.75rem;font-weight:700}.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.aisle{margin-right:22px}.seat{height:50px;border:0;border-radius:11px;background:#e4eaf2;color:var(--ink);font-weight:700;cursor:pointer}.seat:hover,.seat.selected{color:#fff;background:var(--orange)}.seat.occupied{color:#708096;background:#bcc8d6;cursor:not-allowed;text-decoration:line-through}.trip-row{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.trip-row:last-child{border-bottom:0}.trip-row small{display:block;margin-top:4px;color:var(--muted)}.selected-text{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.button{border:0;border-radius:30px;padding:14px 20px;background:var(--orange);color:#fff;font:700 .9rem "DM Sans",sans-serif;cursor:pointer}.button:disabled{opacity:.45;cursor:not-allowed}.continue{width:100%;margin-top:17px}@media(max-width:720px){.booking{grid-template-columns:1fr}.header{padding-bottom:55px}}
  </style>
</head>
<body>
  <header class="header"><div class="wrap"><div class="top"><div class="logo">TRAVEL<span>KONNECT</span></div><a class="back" href="transport-results.html">← Back to rides</a></div><h1>Choose your seat</h1><p>Select an available seat before continuing to traveller information.</p></div></header>
  <main class="wrap booking"><section class="panel"><h2>Your coach</h2><div class="legend"><span><i></i>Available</span><span><i class="selected"></i>Selected</span><span><i class="occupied"></i>Occupied</span></div><div class="bus"><div class="driver">DRIVER</div><div class="seats" id="seats"></div></div></section><aside class="panel"><h2>Trip details</h2><div id="tripDetails"></div><div class="selected-text"><strong id="selectedSeat">No seat selected</strong><p>Your seat is reserved while you enter your details.</p></div><button class="button continue" id="continueButton" disabled>Continue to traveller information</button></aside></main>
  <script>
    const params=new URLSearchParams(location.search);const trip=Object.fromEntries(params.entries());const prettyDate=trip.date?new Date(trip.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'Date to be confirmed';
    document.getElementById('tripDetails').innerHTML=`<div class="trip-row"><div><strong>${trip.from||'Origin'} → ${trip.to||'Destination'}</strong><small>${prettyDate} · ${trip.travelers||'1 Passenger'}</small></div></div><div class="trip-row"><div><strong>${trip.company||'Selected operator'}</strong><small>${trip.service||'Coach service'} · ${trip.price||'Fare to be confirmed'}</small></div></div>`;
    const occupied=['1B','2D','3A','4C','5B','5D'];const seats=['1A','1B','1C','1D','2A','2B','2C','2D','3A','3B','3C','3D','4A','4B','4C','4D','5A','5B','5C','5D'];let chosen='';document.getElementById('seats').innerHTML=seats.map((seat,index)=>`<button class="seat ${(index%4===1)?'aisle ':''}${occupied.includes(seat)?'occupied':''}" ${occupied.includes(seat)?'disabled':''}>${seat}</button>`).join('');
    document.querySelectorAll('.seat:not(.occupied)').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.seat').forEach(seat=>seat.classList.remove('selected'));button.classList.add('selected');chosen=button.textContent;document.getElementById('selectedSeat').textContent=`Seat ${chosen} selected`;document.getElementById('continueButton').disabled=false}));
    document.getElementById('continueButton').addEventListener('click',()=>{trip.seat=chosen;localStorage.setItem('travelkonnectBooking',JSON.stringify(trip));location.href=`traveler-information.html?${new URLSearchParams(trip)}`});
  </script>
</body>
</html>
